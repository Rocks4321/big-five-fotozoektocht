
<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Wachtwoord herstellen | Big Five Fotozoektocht
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #273b27;

      background:
        linear-gradient(
          120deg,
          #f2dfae,
          #aaa77d
        );

      padding: 26px 16px;
    }

    .logo {
      display: block;
      width: 265px;
      max-width: 85%;
      height: auto;
      margin: 4px auto 32px;
    }

    .card {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;

      padding: 36px;
      background: #fffaf0;
      border-radius: 22px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(28px, 5vw, 40px);
      color: #28462b;
    }

    p {
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 20px 0 7px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #b6b6a6;
      border-radius: 9px;
      font: inherit;
    }

    button {
      margin-top: 22px;
      padding: 14px 23px;

      background: #294f30;
      color: white;
      border: 0;
      border-radius: 10px;

      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    a {
      color: #294f30;
      font-weight: bold;
    }

    .message {
      margin-top: 18px;
      line-height: 1.5;
    }

    .error {
      color: #a12626;
    }

    .success {
      color: #246c45;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <img
    class="logo"
    src="/logo-rnr.png"
    alt="Rocks 'n Rivers"
  />

  <main class="card">

    <h1>Wachtwoord herstellen</h1>

    <p>
      Big Five Fotozoektocht –
      Instructeursdashboard
    </p>

    <!-- HERSTELMAIL AANVRAGEN -->

    <section id="requestSection" hidden>

      <p>
        Vul het e-mailadres van je
        instructeursaccount in.
      </p>

      <form id="requestForm">

        <label for="email">
          E-mailadres
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        />

        <button
          id="requestButton"
          type="submit"
        >
          Herstelmail versturen
        </button>

      </form>

    </section>

    <!-- NIEUW WACHTWOORD -->

    <section id="passwordSection" hidden>

      <p>
        Je herstellink is gecontroleerd.
        Kies hieronder een nieuw wachtwoord.
      </p>

      <form id="passwordForm">

        <label for="newPassword">
          Nieuw wachtwoord
        </label>

        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          minlength="12"
          required
        />

        <label for="confirmPassword">
          Herhaal nieuw wachtwoord
        </label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="12"
          required
        />

        <button
          id="saveButton"
          type="submit"
        >
          Nieuw wachtwoord opslaan
        </button>

      </form>

    </section>

    <p
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></p>

    <p>
      <a href="/dashboard.html">
        Terug naar instructeursdashboard
      </a>
    </p>

  </main>

  <script type="module">

    import { createClient }
      from '@supabase/supabase-js'

    const supabase = createClient(
      import.meta.env.VITE_SUPABASE_URL,
      import.meta.env.VITE_SUPABASE_ANON_KEY,
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: true
        }
      }
    )

    const requestSection =
      document.getElementById('requestSection')

    const passwordSection =
      document.getElementById('passwordSection')

    const message =
      document.getElementById('message')

    const requestForm =
      document.getElementById('requestForm')

    const passwordForm =
      document.getElementById('passwordForm')

    const requestButton =
      document.getElementById('requestButton')

    const saveButton =
      document.getElementById('saveButton')

    // Herkennen of iemand via een
    // herstelmail is binnengekomen.

    const initialHash = window.location.hash
    const hashParams = new URLSearchParams(
      initialHash.startsWith('#')
        ? initialHash.slice(1)
        : initialHash
    )

    const hasRecoveryLink =
      hashParams.get('type') === 'recovery' &&
      !!hashParams.get('access_token')

    let recoveryVerified = false

    function showMessage(text, isError = false) {
      message.textContent = text

      message.className =
        'message ' +
        (isError ? 'error' : 'success')
    }

    function showRequestForm() {
      passwordSection.hidden = true
      requestSection.hidden = false
    }

    function showPasswordForm() {
      requestSection.hidden = true
      passwordSection.hidden = false
    }

    // Luisteren naar een geslaagde
    // Supabase-herstelverificatie.

    supabase.auth.onAuthStateChange(
      (event, session) => {
        if (
          event === 'PASSWORD_RECOVERY' &&
          session
        ) {
          recoveryVerified = true
          showPasswordForm()

          showMessage(
            'Je kunt nu een nieuw wachtwoord instellen.'
          )
        }
      }
    )

    // Herstelmail versturen

    requestForm.addEventListener(
      'submit',
      async event => {
        event.preventDefault()

        const email = document
          .getElementById('email')
          .value.trim()

        requestButton.disabled = true

        showMessage(
          'Herstelmail aanvragen...'
        )

        const redirectUrl =
          new URL(
            '/reset-password.html',
            window.location.origin
          ).toString()

        const { error } =
          await supabase.auth.resetPasswordForEmail(
            email,
            {
              redirectTo: redirectUrl
            }
          )

        requestButton.disabled = false

        if (error) {
          showMessage(
            'Herstelmail aanvragen mislukt: ' +
            error.message,
            true
          )

          return
        }

        showMessage(
          'Als dit e-mailadres bij een account ' +
          'hoort, ontvang je een herstelmail. ' +
          'Open de nieuwste link in die e-mail.'
        )
      }
    )

    // Nieuw wachtwoord opslaan

    passwordForm.addEventListener(
      'submit',
      async event => {
        event.preventDefault()

        if (!recoveryVerified) {
          showMessage(
            'De herstellink is niet geldig. ' +
            'Vraag een nieuwe herstelmail aan.',
            true
          )

          showRequestForm()
          return
        }

        const password = document
          .getElementById('newPassword')
          .value

        const confirmation = document
          .getElementById('confirmPassword')
          .value

        if (password.length < 12) {
          showMessage(
            'Gebruik minimaal 12 tekens.',
            true
          )
          return
        }

        if (password !== confirmation) {
          showMessage(
            'De wachtwoorden zijn niet gelijk.',
            true
          )
          return
        }

        saveButton.disabled = true

        showMessage(
          'Nieuw wachtwoord opslaan...'
        )

        const { error } =
          await supabase.auth.updateUser({
            password
          })

        if (error) {
          saveButton.disabled = false

          showMessage(
            'Opslaan mislukt: ' + error.message,
            true
          )

          return
        }

        recoveryVerified = false

        passwordForm.reset()
        passwordSection.hidden = true

        // Inloggen met het nieuwe wachtwoord
        // moet vervolgens via het dashboard.

        await supabase.auth.signOut()

        window.history.replaceState(
          {},
          '',
          '/reset-password.html'
        )

        showMessage(
          'Je wachtwoord is gewijzigd! ' +
          'Ga terug naar het instructeursdashboard ' +
          'en log in met je nieuwe wachtwoord.'
        )
      }
    )

    // Start van de pagina

    async function initialize() {
      const params = new URLSearchParams(
        window.location.search
      )

      const linkError =
        hashParams.get('error_code') ||
        params.get('error_code')

      if (linkError) {
        showRequestForm()

        showMessage(
          'De herstellink is verlopen of ongeldig. ' +
          'Vraag hieronder een nieuwe aan.',
          true
        )

        return
      }

      if (hasRecoveryLink) {
        showMessage(
          'Herstellink controleren...'
        )

        const { data, error } =
          await supabase.auth.getSession()

        if (error || !data.session) {
          showRequestForm()

          showMessage(
            'De herstellink kon niet worden ' +
            'gecontroleerd. Vraag een nieuwe aan.',
            true
          )

          return
        }

        recoveryVerified = true
        showPasswordForm()

        showMessage(
          'Je kunt nu een nieuw wachtwoord instellen.'
        )

        return
      }

      if (!recoveryVerified) {
        showRequestForm()
      }
    }

    initialize()

  </script>

</body>
</html>
